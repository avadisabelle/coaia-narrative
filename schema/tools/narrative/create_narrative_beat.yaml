type: object
properties:
  parentChartId:
    type: string
    description: ID of the parent structural tension chart
  title:
    type: string
    description: Title of the narrative beat
  act:
    type: number
    description: Act number in the narrative sequence
  type_dramatic:
    type: string
    description: Dramatic type (e.g. 'Crisis/Antagonist Force', 'Setup', 'Turning Point')
  perspective_types:
    type: array
    items:
      type: string
    description: "Perspectives that read this beat: engineer, ceremony, story_engine. Supply this or the deprecated 'universes'."
  universes:
    type: array
    items:
      type: string
    deprecated: true
    description: Deprecated alias for 'perspective_types', kept for callers written before 0.17. The older values engineer-world, ceremony-world and story-engine-world are stored as engineer, ceremony and story_engine.
  description:
    type: string
    description: Detailed description of the narrative beat
  prose:
    type: string
    description: Prose narrative of the beat
  lessons:
    type: array
    items:
      type: string
    description: Key lessons or insights from this beat
  assessRelationalAlignment:
    type: boolean
    description: Whether to call iaip-mcp assess_relational_alignment
  initiateFourDirectionsInquiry:
    type: boolean
    description: Whether to call iaip-mcp get_direction_guidance
  filePath:
    type: string
    description: Path to narrative JSONL file (optional)
$comment: One of perspective_types or universes is also required. The server enforces it.
required:
  - parentChartId
  - title
  - act
  - type_dramatic
  - description
  - prose
  - lessons
